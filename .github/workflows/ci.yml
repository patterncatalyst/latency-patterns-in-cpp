# Fast CI gate, the one check the branch ruleset requires: ci-ok. Static
# checks only — never builds the C++ toolchain here. The C++ examples are
# verified locally and by scripts/validate.py's harness-cap check; pulling
# Clang/LLVM into CI would make the CI config the thing that outgrows the
# content (see CLAUDE.md, "Scope discipline").

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -I scripts/validate.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --severity=warning scripts/*.sh examples/*/demo.sh

  jekyll-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build

  # examples/_rust-probe/ is the toolchain probe only; examples/05-wait-free-
  # sync/rust/, examples/06-exploiting-concurrency/rust/, and
  # examples/09-async-processing/rust/ are the three Rust lanes this repo
  # ships (see CLAUDE.md, "The spine": Rust appears only in Ch5, Ch6, Ch9).
  # Separate --manifest-path sets rather than a workspace:
  # each chapter's Rust lane stays a self-contained crate
  # under its own examples/NN-name/rust/, matching the C++ side's one-
  # directory-per-chapter layout, so a later chapter's crate is additive
  # here rather than touching a shared workspace file. Uses the GitHub-
  # hosted runner's own rustup, which honors rust-toolchain.toml at the
  # repo root; the repo-local hermetic toolchain from
  # scripts/bootstrap-rust.sh is for the dev host, not CI.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --manifest-path examples/_rust-probe/Cargo.toml --check
      - run: cargo clippy --manifest-path examples/_rust-probe/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path examples/_rust-probe/Cargo.toml
      - run: cargo fmt --manifest-path examples/05-wait-free-sync/rust/Cargo.toml --check
      - run: cargo clippy --manifest-path examples/05-wait-free-sync/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path examples/05-wait-free-sync/rust/Cargo.toml
      - run: cargo fmt --manifest-path examples/06-exploiting-concurrency/rust/Cargo.toml --check
      - run: cargo clippy --manifest-path examples/06-exploiting-concurrency/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path examples/06-exploiting-concurrency/rust/Cargo.toml
      - run: cargo fmt --manifest-path examples/09-async-processing/rust/Cargo.toml --check
      - run: cargo clippy --manifest-path examples/09-async-processing/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path examples/09-async-processing/rust/Cargo.toml

  # The one check the ruleset requires. Passes only when every job above
  # succeeded (none are conditionally skipped here, but the pattern matches
  # the lgtm-github summary-job skeleton so this stays droppable in place).
  ci-ok:
    if: always()
    needs: [validate, shellcheck, jekyll-build, rust]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' <<<"$NEEDS"
